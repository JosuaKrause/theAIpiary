#
# The server's Redis (the aipiary-server-rserver image: redis with
# deploy/redis/rserver.conf, snapshots to /data). It holds the users, the
# chat sessions and the task queue. The api finds it as rserver:6379
# (deploy/server.config.json), so the Service has to keep that name.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rserver
spec:
  # one Redis with one volume; Recreate stops the old pod before the new one
  # mounts the volume
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: rserver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rserver
    spec:
      containers:
        - name: rserver
          image: aipiary-server-rserver
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ['redis-cli', 'ping']
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rserver-data
---
apiVersion: v1
kind: Service
metadata:
  name: rserver
spec:
  selector:
    app.kubernetes.io/name: rserver
  ports:
    - name: redis
      port: 6379
      targetPort: redis
