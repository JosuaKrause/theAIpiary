#
# The three directories the server keeps its state in. They are mounted by a
# single pod each, so ReadWriteOnce is enough. Sizes are starting points.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rserver-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
# /swai in the api container. With compose it holds server.env; here the
# settings come from the Secret, so it only keeps what the server itself
# writes there (HISTORY_PATH points at it). It stays small.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: api-swai
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# /session in the api container: chat blobs and the session cache
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: api-session
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
