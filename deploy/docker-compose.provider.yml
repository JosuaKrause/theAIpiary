services:
  rmain:
    container_name: rmain
    image: $DOCKER_RMAIN
    restart: always
    expose:
      - 6379
    volumes:
      - ${WEBAPP_STORAGE_HOME}/rmain:/data
  rdata:
    container_name: rdata
    image: $DOCKER_RDATA
    restart: always
    expose:
      - 6379
    volumes:
      - ${WEBAPP_STORAGE_HOME}/rdata:/data
  rcache:
    container_name: rcache
    image: $DOCKER_RCACHE
    restart: always
    expose:
      - 6379
    volumes:
      - ${WEBAPP_STORAGE_HOME}/rcache:/data
  rbody:
    container_name: rbody
    image: $DOCKER_RBODY
    restart: always
    expose:
      - 6379
    volumes:
      - ${WEBAPP_STORAGE_HOME}/rbody:/data
  worker:
    image: $DOCKER_WORKER
    restart: always
    expose:
      - 6380
    volumes:
      - ${WEBAPP_STORAGE_HOME}/swai:/swai
      - ${WEBAPP_STORAGE_HOME}/models:/models
      - ${WEBAPP_STORAGE_HOME}/smind_cache:/smind_cache
      - ${WEBAPP_STORAGE_HOME}/smind_sess:/smind_sess
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  api:
    image: $DOCKER_PROVIDER
    restart: always
    volumes:
      - ${WEBAPP_STORAGE_HOME}/swai:/swai
      - ${WEBAPP_STORAGE_HOME}/models:/models
      - ${WEBAPP_STORAGE_HOME}/smind_cache:/smind_cache
      - ${WEBAPP_STORAGE_HOME}/smind_sess:/smind_sess
# eof
