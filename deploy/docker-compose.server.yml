services:
  rserver:
    container_name: rserver
    image: $DOCKER_RSERVER
    restart: always
    expose:
      - 6379
    volumes:
      - ${WEBAPP_STORAGE_HOME}/swai:/swai
  api:
    image: $DOCKER_SERVER
    restart: always
    ports:
      - '8080:8080'
    volumes:
      - ${WEBAPP_STORAGE_HOME}/swai:/swai
