version: '3.8'
services:
  rmain:
    container_name: rmain
    image: $DOCKER_RMAIN
    restart: always
    expose:
      - 6379
    volumes:
      - ${WEBAPP_STORAGE_HOME}/rmain:/data
  rdata:
    container_name: rdata
    image: $DOCKER_RDATA
    restart: always
    expose:
      - 6379
    volumes:
      - ${WEBAPP_STORAGE_HOME}/rdata:/data
  rcache:
    container_name: rcache
    image: $DOCKER_RCACHE
    restart: always
    expose:
      - 6379
    volumes:
      - ${WEBAPP_STORAGE_HOME}/rcache:/data
  rbody:
    container_name: rbody
    image: $DOCKER_RBODY
    restart: always
    expose:
      - 6379
    volumes:
      - ${WEBAPP_STORAGE_HOME}/rbody:/data
  worker-1:
    image: $DOCKER_WORKER
    restart: always
    expose:
      - 6380
    volumes:
      - ${WEBAPP_STORAGE_HOME}/smind_cache:/smind_cache
      - ${WEBAPP_STORAGE_HOME}/smind_sess:/smind_sess
  # worker-2:
  #   image: $DOCKER_WORKER
  #   restart: always
  #   expose:
  #     - 6380
  #   volumes:
  #     - ${WEBAPP_STORAGE_HOME}/smind_cache:/smind_cache
  #     - ${WEBAPP_STORAGE_HOME}/smind_sess:/smind_sess
  api:
    image: $DOCKER_API
    restart: always
    ports:
      - '8080:8080'
    volumes:
      - ${WEBAPP_STORAGE_HOME}/smind_cache:/smind_cache
      - ${WEBAPP_STORAGE_HOME}/smind_sess:/smind_sess
# eof
