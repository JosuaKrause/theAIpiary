name: Python Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - 'v*'
    tags:
      - 'v*'

jobs:
  ts_pipeline:
    name: Node CI Pipeline
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22]
    env:
      ENV: CI

    steps:
      - uses: actions/checkout@v2

      - name: Install node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: src/swai_client/node_modules/
          key: v1-${{ matrix.node }}-${{ hashFiles('src/swai_client/yarn.lock') }}

      - name: Yarn Install
        run: |
          make install-ts

      - name: Unused exports (ts)
        run: |
          make ts-unused

      - name: Lint Code (ts)
        run: |
          make lint-ts

      - name: Test Code (ts)
        run: |
          make test-ts

      - name: Test Build (ts)
        run: |
          make ts-build

  lints_pipeline:
    name: Lints CI Pipeline
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11']
    env:
      ENV: CI

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'

      - name: Install dependencies
        # CPU-only torch wheels: the default Linux wheel pulls in several GB of
        # CUDA libraries, which fill the runner's disk and are unused by lints
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: |
          make install PYTHON=python

      - name: Lint Code (do not cross import between server and client)
        run: |
          make lint-x-imports

      - name: Lint Code (use uppercase TODO, XXX, FIXME, NOTE and explain nopep8)
        run: |
          make lint-comment

      - name: Lint Code (use empty main inits)
        run: |
          make lint-emptyinit

      - name: Lint Code (sort requirements)
        run: |
          make lint-requirements

      - name: Lint Code (requirements complete)
        run: |
          make requirements-complete

      - name: Lint Code (use f"" style formating)
        run: |
          make lint-stringformat

      - name: Lint Code (indent in fours)
        run: |
          make lint-indent

      - name: Lint Code (no f"a", "{a}", or f'{a}')
        run: |
          make lint-forgottenformat PYTHON=python

      - name: Only pyi in stubs
        run: |
          make lint-pyi

      - name: Lint Code (missing trailing comma)
        run: |
          make lint-flake8

      - name: Lint Code (pycodestyle)
        run: |
          make lint-pycodestyle

      - name: Lint Code (type-check)
        run: |
          make lint-type-check

      - name: Lint Code (pylint)
        run: |
          make lint-pylint

      - name: Test Code (pytest)
        # stores run on redipy's in-memory backend; no services are needed
        run: |
          make pytest PYTHON=python

  build_pipeline:
    name: Build
    needs: [lints_pipeline, ts_pipeline]
    # runs for version tags only and pushes to the registries configured as
    # repository variables PROVIDER_REGISTRY and SERVER_REGISTRY (see
    # system.env.sample); without either variable the job is skipped
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      && (vars.PROVIDER_REGISTRY != '' || vars.SERVER_REGISTRY != '')
    runs-on: ubuntu-latest
    env:
      PROVIDER_REGISTRY: ${{ vars.PROVIDER_REGISTRY }}
      SERVER_REGISTRY: ${{ vars.SERVER_REGISTRY }}
      DOCKER_USER: ${{ secrets.DOCKER_USER }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          # the image tag is derived from the git tags
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install node
        if: vars.SERVER_REGISTRY != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build provider docker images
        if: vars.PROVIDER_REGISTRY != ''
        run: |
          make -s build-provider

      - name: Push provider docker images
        if: vars.PROVIDER_REGISTRY != ''
        run: |
          make -s dockerpush-provider

      - name: Build server docker images
        if: vars.SERVER_REGISTRY != ''
        run: |
          make -s build-server

      - name: Push server docker images
        if: vars.SERVER_REGISTRY != ''
        run: |
          make -s dockerpush-server
