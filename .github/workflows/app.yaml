name: Python Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - 'v*'
    tags:
      - 'v*'

jobs:
  ts_pipeline:
    name: Node CI Pipeline
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [16]
    env:
      ENV: CI

    steps:
      - uses: actions/checkout@v2

      - name: Install node ${{ matrix.node }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node }}

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: src/swai_client/node_modules/
          key: v1-${{ matrix.node }}-${{ hashFiles('src/swai_client/yarn.lock') }}

      - name: Yarn Install
        run: |
          make install-ts

      - name: Unused exports (ts)
        run: |
          make ts-unused

      - name: Lint Code (ts)
        run: |
          make lint-ts

      - name: Test Code (ts)
        run: |
          make test-ts

      - name: Test Build (ts)
        run: |
          make ts-build

  lints_pipeline:
    name: Lints CI Pipeline
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11']
    env:
      ENV: CI

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          make install PYTHON=python

      - name: Lint Code (do not cross import between server and client)
        run: |
          make lint-x-imports

      - name: Lint Code (use uppercase TODO, XXX, FIXME, NOTE and explain nopep8)
        run: |
          make lint-comment

      - name: Lint Code (use empty main inits)
        run: |
          make lint-emptyinit

      - name: Lint Code (sort requirements)
        run: |
          make lint-requirements

      - name: Lint Code (requirements complete)
        run: |
          make requirements-complete

      - name: Lint Code (use f"" style formating)
        run: |
          make lint-stringformat

      - name: Lint Code (indent in fours)
        run: |
          make lint-indent

      - name: Lint Code (no f"a", "{a}", or f'{a}')
        run: |
          make lint-forgottenformat PYTHON=python

      - name: Only pyi in stubs
        run: |
          make lint-pyi

      - name: Lint Code (missing trailing comma)
        run: |
          make lint-flake8

      - name: Lint Code (pycodestyle)
        run: |
          make lint-pycodestyle

      - name: Lint Code (type-check)
        run: |
          make lint-type-check

      - name: Lint Code (pylint)
        run: |
          make lint-pylint

  build_pipeline:
    name: Build
    needs: [lints_pipeline, ts_pipeline]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build provider docker image
        run: |
          make -s build-provider

      - name: Push provider docker image
        run: |
          make -s dockerpush-provider
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}

      - name: AZ Docker login
        uses: azure/docker-login@v1
        with:
          login-server: acclabdocker.azurecr.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build server docker image
        run: |
          make -s build-server

      - name: Push server docker image
        run: |
          make -s dockerpush-server
